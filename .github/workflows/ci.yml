# Every check of CLAUDE.md → Commands, on every pull request and on main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      # Also checks that the Gradle wrapper is Gradle's own.
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build debug and release (R8)
        run: ./gradlew assembleDebug assembleRelease
      - name: Android Lint
        run: ./gradlew lintDebug lintRelease
      - name: Licences of the dependencies
        run: ./gradlew licenseeAndroidDebug licenseeAndroidRelease

  test:
    name: Unit and screenshot tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6.4.1
      # Robolectric's Android jar (build.gradle.kts): Maven Central answers 429 to busy
      # runners, so it keeps a cache of its own, fetched with retries only when missing and
      # saved at once (whatever the tests do next). Its key follows its version in
      # gradle/libs.versions.toml.
      - name: Robolectric's Android jar (cached)
        id: robolectric
        uses: actions/cache/restore@v4
        with:
          path: build/robolectric
          key: robolectric-android-all-14-robolectric-10818077-i7
      - name: Robolectric's Android jar (fetched, with retries)
        if: steps.robolectric.outputs.cache-hit != 'true'
        run: |
          for wait in 0 60 120 240; do
            sleep "$wait"
            ./gradlew robolectricJars && exit 0
          done
          exit 1
      - name: Robolectric's Android jar (kept)
        if: steps.robolectric.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/robolectric
          key: robolectric-android-all-14-robolectric-10818077-i7
      - name: Unit tests (every module)
        run: ./gradlew test
      - name: Screenshots (Roborazzi)
        run: ./gradlew verifyRoborazziDebug
      - name: Screenshot differences
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshot-differences
          path: "**/build/outputs/roborazzi/**"

  style:
    name: ktlint, detekt, module lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: detekt
        run: ./gradlew detekt
      - name: Android Lint (every module)
        run: ./gradlew lint

  reuse:
    name: REUSE (licence headers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: fsfe/reuse-action@v6.0.0
