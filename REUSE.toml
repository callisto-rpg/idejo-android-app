version = 1
SPDX-PackageName = "idejo for Android"
SPDX-PackageSupplier = "Mariano Pictet"
SPDX-PackageDownloadLocation = "https://github.com/callisto-rpg/idejo-android-app"

# Files that cannot carry an SPDX header of their own (LI-01).
[[annotations]]
path = ["idejo Android — Spec Sheet.md", "NOTICE", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Mariano Pictet and contributors"
SPDX-License-Identifier = "Apache-2.0"

# Fraunces and Rubik, from their upstream releases (TH-04): Fraunces 1.000
# (undercasetype/Fraunces), Rubik 2.300 (googlefonts/rubik at e337a5f).
[[annotations]]
path = "core/designsystem/src/main/res/font/fraunces.ttf"
precedence = "override"
SPDX-FileCopyrightText = "2020 The Fraunces Project Authors (github.com/undercasetype/Fraunces)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "core/designsystem/src/main/res/font/rubik.ttf"
precedence = "override"
SPDX-FileCopyrightText = "2015 The Rubik Project Authors (https://github.com/googlefonts/rubik)"
SPDX-License-Identifier = "OFL-1.1"

# JSON payloads for the API tests (JSON has no comments).
[[annotations]]
path = "**/src/test/resources/payloads/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Mariano Pictet and contributors"
SPDX-License-Identifier = "Apache-2.0"

# Screenshots the tests record.
[[annotations]]
path = "**/src/test/screenshots/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Mariano Pictet and contributors"
SPDX-License-Identifier = "Apache-2.0"

# The Gradle wrapper, as Gradle generates it.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "2015 the original authors"
SPDX-License-Identifier = "Apache-2.0"
